name: E2E and Visual Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @js-ds-ui/e2e exec playwright install --with-deps ${{ matrix.project }}

      - name: Build tokens
        run: pnpm --filter @js-ds-ui/tokens build

      - name: Run e2e tests
        run: pnpm --filter @js-ds-ui/e2e test -- --project=${{ matrix.project }}
        env:
          CI: true

      - name: Upload e2e report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-${{ matrix.project }}
          path: js-ds-ui/packages/e2e/playwright-report/
          retention-days: 14

  mobile:
    name: E2E (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @js-ds-ui/e2e exec playwright install --with-deps chromium webkit

      - name: Build tokens
        run: pnpm --filter @js-ds-ui/tokens build

      - name: Run mobile tests
        run: pnpm --filter @js-ds-ui/e2e test -- --project=mobile-chrome --project=mobile-safari
        env:
          CI: true

      - name: Upload mobile report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-mobile
          path: js-ds-ui/packages/e2e/playwright-report/
          retention-days: 14

  visual:
    name: Visual Regression
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter @js-ds-ui/e2e exec playwright install --with-deps chromium

      - name: Build tokens
        run: pnpm --filter @js-ds-ui/tokens build

      - name: Run visual regression tests
        run: pnpm --filter @js-ds-ui/e2e test -- --project=visual-regression
        env:
          CI: true

      - name: Upload visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-report
          path: js-ds-ui/packages/e2e/playwright-report/
          retention-days: 14

      - name: Upload visual diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: js-ds-ui/packages/e2e/test-results/
          retention-days: 14
